name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, build, format, tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require committed lockfile
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::Falta pnpm-lock.yaml en el repo. Ejecuta el workflow 'Actualizar lockfile' (Actions > Actualizar lockfile > Run workflow), mezcla el PR que abre y vuelve a correr el CI."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # Este repo se despliega aislado: en Vercel NO existe el directorio
      # hermano ../voyya-shared. Una dependencia "link:" o "file:" funciona en
      # local y rompe el despliegue con un error de resolución poco legible.
      # ADR-016 fija la referencia real (git/registro); esto impide que el
      # puente de desarrollo llegue a main sin que nadie se dé cuenta.
      - name: Assert no local path dependencies
        run: |
          if grep -nE '"(link|file):' package.json; then
            echo "::error::package.json referencia una dependencia por ruta local (link:/file:)."
            echo "::error::Sustitúyela por la referencia de ADR-016 antes de mezclar a main."
            exit 1
          fi
          echo "Sin dependencias por ruta local."

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Format check
        run: pnpm run format:check

      - name: Tokens contract (ADR-026)
        run: pnpm run test:tokens
