name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, build, format
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # Este repo se despliega aislado: en Vercel NO existe el directorio
      # hermano ../voyya-shared. Una dependencia "link:" o "file:" funciona en
      # local y rompe el despliegue con un error de resolución poco legible.
      # ADR-016 fija la referencia real (git/registro); esto impide que el
      # puente de desarrollo llegue a main sin que nadie se dé cuenta.
      - name: Assert no local path dependencies
        run: |
          if grep -nE '"(link|file):' package.json; then
            echo "::error::package.json referencia una dependencia por ruta local (link:/file:)."
            echo "::error::Sustitúyela por la referencia de ADR-016 antes de mezclar a main."
            exit 1
          fi
          echo "Sin dependencias por ruta local."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Format check
        run: pnpm run format:check

      # No hay un paso "test": este proyecto todavía no tiene script "test" ni
      # runner configurado. Añadir uno aquí simularía una garantía de calidad
      # inexistente. Este CI verifica lo que hoy sí se puede comprobar:
      # typecheck, lint y build (tsc --noEmit + vite build).
