name: E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: >-
          URL de la consola voyya-admin a probar (por ejemplo, un preview de Vercel que hable
          con un backend de QA). NUNCA la URL de producción.
        required: true
        type: string
      run_data_creating_tests:
        description: >-
          Ejecutar también las pruebas que crean datos permanentes (solicitud de afiliación,
          alta de conductor). No tienen forma de limpiarse por completo: solo actívalo contra
          un backend de QA desechable, nunca contra un entorno compartido.
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-playwright-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject an obvious production URL
        env:
          TARGET_URL: ${{ inputs.base_url }}
        run: |
          case "$TARGET_URL" in
            *voyyaapi-production*|*railway.app*)
              echo "::error::base_url parece apuntar a un backend de producción. Usa un entorno de QA desechable."
              exit 1
              ;;
          esac
          echo "URL objetivo: $TARGET_URL"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Assert no local path dependencies
        run: |
          if grep -nE '"(link|file):' package.json; then
            echo "::error::package.json referencia una dependencia por ruta local (link:/file:)."
            exit 1
          fi
          echo "Sin dependencias por ruta local."

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck e2e tests
        run: pnpm run typecheck:e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ inputs.base_url }}
          RUN_DATA_CREATING_TESTS: ${{ inputs.run_data_creating_tests }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_PLATFORM_ADMIN_EMAIL: ${{ secrets.E2E_PLATFORM_ADMIN_EMAIL }}
          E2E_PLATFORM_ADMIN_PASSWORD: ${{ secrets.E2E_PLATFORM_ADMIN_PASSWORD }}
        run: |
          if [ "$RUN_DATA_CREATING_TESTS" = "true" ]; then
            echo "Ejecutando el suite completo, incluidas las pruebas que crean datos permanentes."
            pnpm exec playwright test
          else
            echo "Ejecutando solo pruebas de solo lectura (sin @data-creating)."
            pnpm exec playwright test --grep-invert "@data-creating"
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
